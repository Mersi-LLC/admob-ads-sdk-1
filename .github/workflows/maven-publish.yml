# Builds the Android library and publishes its AAR to GitHub Packages
# when a GitHub release is created.

name: Publish Android Library

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: "gradle"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build library
        run: ./gradlew :library:assembleRelease --no-daemon

      - name: Publish to GitHub Packages
        run: ./gradlew :library:publishReleasePublicationToGitHubPackagesRepository --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
